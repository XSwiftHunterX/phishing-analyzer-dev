{% extends "analyzer/base.html" %}

{% block title %}Submit Message{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3 mb-3">Submit a Possible Phishing Message</h1>

        <p class="text-muted">Logged in as <strong>{{ user.username }}</strong></p>

        <div class="mb-3">
            <a href="/" class="btn btn-outline-secondary btn-sm">Back to Message List</a>
            <a href="/profile/" class="btn btn-outline-secondary btn-sm">My Profile</a>
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Submit Message</button>
        </form>
    </div>
</div>

{% endblock %}
