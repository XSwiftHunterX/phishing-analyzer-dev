{% extends "analyzer/base.html" %}

{% block title %}Delete Comment{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h1 class="h3 text-danger mb-3">Delete Comment</h1>

                <p>Are you sure you want to delete this comment?</p>

                <div class="border rounded p-3 bg-light mb-3">
                    <p class="mb-1"><strong>{{ comment.user.username }}</strong></p>
                    <p class="mb-0">{{ comment.content }}</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="/message/{{ comment.message.id }}/" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
