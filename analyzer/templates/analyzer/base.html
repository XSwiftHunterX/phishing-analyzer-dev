<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Phishing Message Analyzer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Phishing Message Analyzer</a>

        <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">
            {% if user.is_authenticated %}
                <span class="text-white small">Logged in as <strong>{{ user.username }}</strong></span>
                <a href="/submit/" class="btn btn-outline-light btn-sm"><i class="bi bi-plus-circle"></i> Submit Message</a>
                <a href="/profile/" class="btn btn-outline-light btn-sm"><i class="bi bi-person"></i> My Profile</a>
                <form action="/accounts/logout/" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-warning btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </form>
            {% else %}
                <a href="/accounts/login/" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                <a href="/register/" class="btn btn-primary btn-sm"><i class="bi bi-person-plus"></i> Create Account</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted mt-5">
    <hr>
    <p class="small">
        Phishing Message Analyzer • CSCI 4830 Tech Exercise • Built with Django
    </p>
</footer>

</body>
</html>
