{% extends "analyzer/base.html" %}

{% block title %}Password Updated{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <img src="/media/website_images/LogoWithBackground.png"
                         alt="PhishWatch Logo"
                         height="80"
                         class="mb-3">

                    <h1 class="h3 mb-2">Password Updated</h1>

                    <p class="text-muted mb-0">
                        Your password has been changed successfully. You can now sign in with your new password.
                    </p>
                </div>

                <div class="alert alert-success text-start">
                    <strong>Success.</strong><br>
                    Your account is ready to use again.
                </div>

                <a href="{% url 'account_login' %}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
