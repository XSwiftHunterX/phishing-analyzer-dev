<!DOCTYPE html>
<html>
<body style="margin:0; padding:20px; background:#f8fafc; font-family:Arial, sans-serif;">

<div style="max-width:500px; margin:auto; background:white; padding:30px; border-radius:10px; border:1px solid #dbeafe;">

    <div style="text-align:center; margin-bottom:20px;">
        <img src="http://18.189.215.139/media/website_images/LogoWithBackground.png"
             alt="PhishWatch Logo"
             height="55"
             style="display:block; margin:0 auto 10px;">
        <div style="font-size:20px; font-weight:700; color:#0f172a;">PhishWatch</div>
    </div>

    <h2 style="text-align:center; margin:0 0 12px 0; color:#0f172a;">
        Reset your password
    </h2>

    <p style="text-align:center; color:#334155; font-size:16px; line-height:1.6; margin:0 0 20px 0;">
        We received a request to reset the password for your <strong>PhishWatch</strong> account.
    </p>

    <div style="text-align:center; margin:25px 0;">
        <a href="{{ password_reset_url }}"
           style="background:#2563eb; color:white; padding:12px 20px; border-radius:6px; text-decoration:none; font-weight:bold; display:inline-block;">
            Reset Password
        </a>
    </div>

    <p style="font-size:13px; color:#64748b; text-align:center; margin-bottom:8px;">
        If the button does not work, copy and paste this link into your browser:
    </p>

    <p style="font-size:13px; word-break:break-all; text-align:center; margin-top:0;">
        <a href="{{ password_reset_url }}" style="color:#2563eb;">
            {{ password_reset_url }}
        </a>
    </p>

    <div style="margin-top:24px; padding-top:18px; border-top:1px solid #dbeafe;">
        <p style="font-size:12px; color:gray; text-align:center; margin:0;">
            If you did not request a password reset, you can safely ignore this email.
        </p>
    </div>

</div>

</body>
</html>
